name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# 同一分支的连续 push 取消进行中的旧 run，避免排队浪费额度
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Backend tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 与 Dockerfile 使用的 node:18-alpine 保持一致，20 覆盖后续升级
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 根依赖不可省：telegramScheduler/telegramUserAuth 用例会跨目录引用
      # telegram-bot/ 下的代码，其 node-cron 等依赖是从根 node_modules 解析的
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run backend tests
        # 运行器默认把 DB_STORAGE 指向临时目录，不依赖仓库内的数据库文件
        run: npm run test:server

  client:
    name: Frontend tests
    runs-on: ubuntu-latest
    env:
      # timeDisplay / inputPreprocess 等用例断言悉尼时区行为（与 TG bot 的
      # Australia/Sydney cron 一致），UTC runner 上会挂，需固定时区
      TZ: Australia/Sydney

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        # 必须串行：并行时 antd 重渲染用例会随机超时，见 test:client 的 --runInBand
        run: npm run test:client
        env:
          CI: true

      - name: Build with warnings as errors
        # ESLint warning 已清零（5d15016），此步防止回潮
        run: npm run build
        env:
          CI: true
